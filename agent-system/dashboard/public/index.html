<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Agent Team</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="shell" id="shell">
      <aside class="sidebar" aria-label="Team and project">
        <div class="sidebar-top">
          <div class="brand"><span class="brand-mark" aria-hidden="true">✻</span><span id="brand-name">Agent Team</span></div>
          <button class="icon-btn only-mobile" id="close-sidebar" aria-label="Close sidebar">✕</button>
        </div>
        <button class="new-session" id="reset"><span aria-hidden="true">＋</span> New session</button>

        <nav class="side-section" aria-labelledby="team-heading">
          <h2 class="side-heading" id="team-heading">Team</h2>
          <ul class="team" id="team"></ul>
        </nav>

        <section class="side-section" aria-labelledby="gate-heading">
          <h2 class="side-heading" id="gate-heading">Delivery</h2>
          <button class="gate-card" id="gate-card">
            <span class="gate-label">Current gate</span>
            <span class="gate-text" id="gate">Reading status…</span>
            <span class="gate-counts" id="gate-counts"></span>
          </button>
        </section>

        <div class="sidebar-foot">
          <div class="plan" id="plan"><span class="dot"></span><span id="plan-text">Checking sign-in…</span></div>
          <div class="foot-row">
            <span class="conn" id="connection"><span class="dot"></span><b>Connecting</b></span>
            <button class="icon-btn" id="theme" aria-label="Toggle light and dark theme">◐</button>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="icon-btn only-mobile" id="open-sidebar" aria-label="Open sidebar">☰</button>
          <div class="who">
            <span class="avatar avatar-lg hue-coral" aria-hidden="true">🧭</span>
            <div>
              <div class="who-name">Sage <span class="who-role">Delivery Supervisor</span></div>
              <div class="who-status" id="sage-status">Idle</div>
            </div>
          </div>
          <div class="topbar-actions">
            <span class="replay-badge" id="replay" hidden></span>
            <span class="usage" id="usage" title="The CLI's estimate at API prices. Not charged: runs on your plan."></span>
            <button class="pill-btn" id="toggle-pane" aria-expanded="true" aria-controls="pane">Team activity <span class="count" id="live-count" hidden></span></button>
          </div>
        </header>

        <section class="chat" id="chat" aria-label="Conversation with the supervisor">
          <div class="chat-inner" id="timeline" aria-live="polite"></div>
        </section>

        <section class="now-strip" id="live" aria-label="Working now" aria-live="polite" hidden></section>
        <form class="composer" id="composer">
          <p class="billing-banner" id="billing-banner" role="alert" hidden></p>
          <div class="composer-box">
            <label class="sr" for="input">Message Sage, the supervisor</label>
            <textarea id="input" rows="1" placeholder="Message Sage…" autocomplete="off"></textarea>
            <div class="composer-row">
              <span class="composer-hint" id="composer-hint">Enter to send · Shift+Enter for a new line</span>
              <button type="button" class="stop-btn" id="stop" hidden aria-label="Stop Sage and the team">■</button>
              <button type="submit" class="send-btn" id="send" aria-label="Send">↑</button>
            </div>
          </div>
        </form>
      </main>

      <aside class="pane" id="pane" aria-label="Team activity and board">
        <div class="pane-tabs" role="tablist">
          <button role="tab" class="tab active" data-tab="activity" aria-selected="true">Activity</button>
          <button role="tab" class="tab" data-tab="board" aria-selected="false">Board</button>
          <button class="icon-btn pane-close" id="close-pane" aria-label="Close panel">✕</button>
        </div>
        <div class="pane-body" id="pane-body"></div>
      </aside>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
